
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Balenrista - Order Online</title>
  
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Splash&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    
    :root {
      /* 🌟 ธีมสี Dark Neumorphism (ดึงมาจากสีเดิมของร้าน) */
      --bg-main: #262422;       /* สีพื้นฐาน (ต้องเหมือนกันทั้งฉากหลังและปุ่ม) */
      --col-accent: #B7B4AE;    /* สีตัวอักษรหลัก */
      --col-active: #D3D0C9;    /* สีตัวอักษรตอนปุ่มถูกกด */
      --col-danger: #ff6b6b;
      --text-muted: #8c8881;
      --text-dark: #11100F;
      
      /* 🌟 สูตรแสงและเงา 3D */
      --shadow-out: 6px 6px 12px #151312, -6px -6px 12px #373532; /* นูนขึ้น */
      --shadow-in: inset 5px 5px 10px #151312, inset -5px -5px 10px #373532; /* ยุบลง */
      --shadow-sm: 4px 4px 8px #151312, -4px -4px 8px #373532; /* นูนขึ้นแบบเล็กๆ */
      
      --border-radius-btn: 14px;
      --border-radius-card: 20px;
    }

    html, body { 
      width: 100%; 
      max-width: 100vw; 
      overflow-x: hidden; 
      background-color: var(--bg-main); 
      color: var(--col-accent);
      font-family: 'Prompt', sans-serif;
      padding-bottom: 110px;
    }
    
    /* Header */
    .header { 
      background: var(--bg-main); 
      color: var(--col-accent); 
      padding: 16px 20px; 
      font-size: 18px; 
      font-weight: 600; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      position: sticky; 
      top: 0; 
      z-index: 100; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.3); /* เงาใต้ Header แยกสัดส่วน */
    }

            /* 🌟 ปรับให้ส่วนหัวใช้ฟอนต์ Splash ทั้งหมด */
    .header-title {
      font-family: 'Splash', cursive; /* 👈 ใส่ตรงนี้เพื่อให้ทั้ง Balenrista และ Order ใช้ฟอนต์ Splash ร่วมกัน */
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    
    .brand-balenrista {
      color: #ff4757;
      font-size: 32px;
      font-weight: 400;
      letter-spacing: 1px;
    }
    
    .brand-order {
      color: #ffffff;
      font-size: 22px; /* ขนาดเล็กลงมาหน่อยเพื่อให้ชื่อร้าน Balenrista ดูเด่นกว่า */
      font-weight: 400;
      letter-spacing: 1px;
    }

    .container { padding: 16px; width: 100%; max-width: 600px; margin: 0 auto; }
    
    /* Banner แจ้งเตือน */
    .alert-banner { 
      background-color: var(--bg-main); 
      color: var(--col-danger); 
      padding: 14px 16px; 
      border-radius: var(--border-radius-btn); 
      font-size: 13px; 
      font-weight: 600; 
      margin-bottom: 20px; 
      text-align: center; 
      box-shadow: var(--shadow-in); /* ทำให้ดูเหมือนจมลงไปในจอ */
    }
    
    /* แถบหมวดหมู่แบบเลื่อนขวาง */
    .category-scroll { 
      display: flex; 
      overflow-x: auto; 
      gap: 16px; 
      padding: 10px 4px 16px 4px; 
      margin-bottom: 12px; 
      scrollbar-width: none; 
    }
    .category-scroll::-webkit-scrollbar { display: none; }
    
    .cat-tab { 
      background: var(--bg-main); 
      box-shadow: var(--shadow-out); /* ทำให้นูนขึ้น */
      padding: 10px 20px; 
      border-radius: 9999px; 
      font-size: 13px; 
      font-weight: 600; 
      color: var(--text-muted); 
      white-space: nowrap; 
      cursor: pointer; 
      transition: all 0.2s ease; 
      border: none;
    }
    .cat-tab.active { 
      box-shadow: var(--shadow-in); /* เวลากดให้บุ๋มลงไป */
      color: var(--col-active); 
    }
    
    /* รายการเมนูกริด 2 คอลัมน์ */
    .menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; padding: 4px; }
    .menu-card { 
      background: var(--bg-main); 
      border-radius: var(--border-radius-card); 
      padding: 14px; 
      box-shadow: var(--shadow-out); /* การ์ดลอยขึ้นจากจอ */
      display: flex; 
      flex-direction: column; 
      position: relative; 
    }
    
    /* กรอบรูปภาพ (ทำให้จมลงไปนิดๆ เพื่อเน้นรูป) */
    .menu-img-wrapper { 
      position: relative; 
      width: 100%; 
      aspect-ratio: 1; 
      border-radius: 12px; 
      background: var(--bg-main); 
      overflow: hidden; 
      margin-bottom: 12px; 
      box-shadow: var(--shadow-in); 
      padding: 4px;
    }
    .menu-img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; }
    
    .menu-info { flex-grow: 1; display: flex; flex-direction: column; }
    .menu-title { font-size: 14px; font-weight: 600; line-height: 1.4; margin-bottom: 6px; color: var(--col-active); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .menu-desc { font-size: 11px; color: var(--text-muted); line-height: 1.4; margin-bottom: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; flex-grow: 1; }
    
    /* ราคา + ปุ่มบวก */
    .card-action-row { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
    .card-price { font-size: 16px; font-weight: 700; color: #4CAF50; }
    
    /* ปุ่มบวกแบบ 3D */
    .add-icon-btn { 
      background: var(--bg-main); 
      color: var(--col-active); 
      border: none; 
      width: 36px; 
      height: 36px; 
      border-radius: 50%; /* เปลี่ยนเป็นวงกลมให้สวยขึ้น */
      font-size: 20px; 
      font-weight: 500; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      cursor: pointer; 
      box-shadow: var(--shadow-sm); 
      transition: all 0.2s ease; 
    }
    .add-icon-btn:active { box-shadow: var(--shadow-in); transform: scale(0.95); } /* เอฟเฟกต์เวลากดปุ่ม */
    
    /* แถบควบคุมตะกร้าสินค้าด้านล่างสุด */
    .cart-bar { 
      position: fixed; 
      bottom: 0; left: 0; right: 0; 
      background: var(--bg-main); 
      padding: 20px; 
      box-shadow: 0 -8px 20px rgba(0,0,0,0.4); 
      z-index: 999; 
      display: flex; 
      justify-content: center; 
    }
    .confirm-btn { 
      width: 100%; 
      max-width: 560px; 
      border: none; 
      padding: 16px; 
      border-radius: 16px; 
      font-family: 'Prompt', sans-serif; 
      font-size: 15px; 
      font-weight: 700; 
      color: var(--text-dark); 
      background-color: var(--col-accent); /* ใช้สีหลักของร้าน */
      box-shadow: 4px 4px 10px rgba(0,0,0,0.5), inset 2px 2px 4px rgba(255,255,255,0.3); /* ปุ่มยืนยันยังต้องเด่นอยู่ */
      cursor: pointer; 
      transition: all 0.2s ease; 
      text-align: center; 
    }
    .confirm-btn:active { transform: scale(0.98); box-shadow: inset 4px 4px 8px rgba(0,0,0,0.5); }
    .confirm-btn:disabled { opacity: 0.5; box-shadow: var(--shadow-in); background: var(--bg-main); color: var(--text-muted); }


    /* ปุ่มติดต่อร้านลอยแยกจากแถบยืนยันออเดอร์ */
    .contact-float-btn {
      position: fixed;
      right: max(24px, env(safe-area-inset-right));
      bottom: calc(100px + env(safe-area-inset-bottom));
      z-index: 1000;
      width: 54px;
      height: 54px;
      border: none;
      outline: none;
      border-radius: 50%;
      background: var(--bg-main);
      color: var(--col-active);
      box-shadow: 6px 6px 14px rgba(0,0,0,.38), -4px -4px 12px rgba(255,255,255,.025);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .contact-float-btn:active { box-shadow: var(--shadow-in); transform: scale(.94); }
    .contact-float-btn svg { width: 25px; height: 25px; display: block; }

    /* Popup ช่องทางติดต่อร้าน */
    .contact-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000001;
      background: rgba(0,0,0,.48);
      align-items: flex-end;
      justify-content: center;
      padding: 18px 14px max(18px, env(safe-area-inset-bottom));
    }
    .contact-overlay.show { display: flex; }

    .contact-popup {
      width: 100%;
      max-width: 440px;
      max-height: min(88vh, 760px);
      overflow-y: auto;
      overscroll-behavior: contain;
      background: var(--bg-main);
      border-radius: 26px;
      padding: 0 20px 20px;
      box-shadow: 0 -10px 35px rgba(0,0,0,.55), var(--shadow-out);
      animation: contactRise .22s ease-out;
    }
    .contact-cover {
      display: block;
      width: calc(100% + 40px);
      height: 142px;
      margin: 0 -20px 16px;
      object-fit: cover;
      object-position: center;
      border-radius: 26px 26px 0 0;
    }
    .contact-popup-brandrow {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }
    .contact-logo {
      width: 48px;
      height: 48px;
      object-fit: contain;
      flex: 0 0 48px;
    }
    @keyframes contactRise {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .contact-popup-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }
    .contact-brand {
      color: var(--col-active);
      font-size: 17px;
      font-weight: 700;
      letter-spacing: .2px;
    }
    .contact-slogan {
      color: var(--text-muted);
      font-size: 11px;
      margin-top: 4px;
    }
    .contact-close {
      flex: 0 0 34px;
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 50%;
      color: var(--col-accent);
      background: var(--bg-main);
      box-shadow: var(--shadow-sm);
      font-size: 17px;
      cursor: pointer;
    }
    .contact-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }
    .contact-link {
      min-height: 88px;
      padding: 13px 6px 10px;
      border-radius: 16px;
      background: var(--bg-main);
      box-shadow: var(--shadow-sm);
      color: var(--col-accent);
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 500;
      text-align: center;
      transition: box-shadow .2s ease, transform .2s ease;
    }
    .contact-link:active { box-shadow: var(--shadow-in); transform: scale(.97); }
    .contact-link svg { width: 25px; height: 25px; display: block; }
    .contact-link .contact-phone { color: #8fc7a0; }
    .contact-link .contact-line { color: #06C755; }
    .contact-link .contact-facebook { color: #1877F2; }
    .contact-link .contact-instagram { color: #E66A8D; }
    .contact-link .contact-tiktok { color: var(--col-active); }
    .contact-link .contact-map { color: #D96B5F; }
    .contact-hours {
      margin-top: 16px;
      padding: 13px 14px;
      border-radius: 14px;
      background: var(--bg-main);
      box-shadow: var(--shadow-in);
      color: var(--text-muted);
      font-size: 11px;
      line-height: 1.7;
      text-align: center;
    }
    .contact-hours strong { color: var(--col-active); font-weight: 600; }
    @media (max-width: 360px) {
      .contact-cover { height: 116px; }
      .contact-logo { width: 42px; height: 42px; flex-basis: 42px; }
      .contact-grid { gap: 9px; }
      .contact-link { min-height: 82px; font-size: 10px; }
    }

    /* โครงสร้างป๊อปอัพสไลด์ขึ้น */
    .sheet-overlay { position: fixed; top: 0; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.7); z-index: 1000; display: none; }
    .bottom-sheet { 
      position: fixed; 
      bottom: 0; left: 0; right: 0; 
      background: var(--bg-main); 
      border-top-left-radius: 30px; 
      border-top-right-radius: 30px; 
      max-height: 85vh; 
      z-index: 1001; 
      display: flex; 
      flex-direction: column; 
      transform: translateY(100%); 
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* ทำให้เด้งดึ๋งนิดๆ */
      box-shadow: 0 -10px 30px rgba(0,0,0,0.6); 
    }
    .sheet-header { padding: 24px; display: flex; justify-content: space-between; align-items: center; }
    .sheet-title { font-size: 16px; font-weight: 700; color: var(--col-active); }
    .close-sheet { background: var(--bg-main); border: none; font-size: 14px; width: 32px; height: 32px; border-radius: 50%; color: var(--col-accent); cursor: pointer; box-shadow: var(--shadow-sm); display: flex; justify-content: center; align-items: center; }
    .close-sheet:active { box-shadow: var(--shadow-in); }
    .sheet-content { padding: 0 24px 20px 24px; overflow-y: auto; flex-grow: 1; }
    
    /* สไตล์กลุ่มตัวเลือกภายในป๊อปอัพ */
    .option-group-title { font-size: 13px; font-weight: 700; margin-top: 16px; margin-bottom: 16px; color: var(--col-accent); display: flex; justify-content: space-between; text-transform: uppercase; letter-spacing: 0.5px; }
    .option-group-title span.required { color: var(--col-danger); font-size: 11px; font-weight: 400; }
    .option-selector-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-bottom: 24px; padding: 8px 4px; }
    
    /* ปุ่มตัวเลือก */
    .opt-btn { 
      background: var(--bg-main); 
      box-shadow: var(--shadow-out);
      border: none; 
      padding: 14px; 
      border-radius: var(--border-radius-btn); 
      font-family: 'Prompt', sans-serif; 
      font-size: 12px; 
      text-align: center; 
      cursor: pointer; 
      transition: all 0.2s; 
      color: var(--text-muted); 
      font-weight: 500;
    }
    .opt-btn.active { 
      box-shadow: var(--shadow-in); /* ยุบลงเวลาถูกเลือก */
      color: #4CAF50; /* ใช้สีเขียวให้รู้ว่าถูกเลือก */
      font-weight: 700; 
    }
    
    /* โครงสร้างรายการภายในตะกร้า */
    .cart-item-row { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .cart-item-name { font-size:
